- name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Global Data Vacuum (Pull Historic Data)
        run: python global_ingestor.py
      - name: Auto-Fetch Results (Daily Learning)
        run: python results_fetcher.py
      - name: Run SOTA Predictions
        run: python oracle.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit Database Updates
        run: |
          git config --global user.name 'Oracle-Bot'
          git config --global user.email 'bot@oracle.ai'
          git add players.json
          git commit -m "Autonomous Intelligence Update: Global Data Pulled" || echo "No changes"
          git push
