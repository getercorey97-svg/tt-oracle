name: TT-Oracle-Autonomous
on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:
jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Deps
        run: pip install -r requirements.txt
      - name: Auto-Fetch Results
        run: python results_fetcher.py
      - name: Run Engine (Learning & Prediction)
        run: python oracle.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save Learning
        run: |
          git config --global user.name 'Oracle-Bot'
          git config --global user.email 'bot@oracle.ai'
          git add players.json
          git commit -m "Autonomous Result Learning Update" || echo "No changes"
          git push
