name: TT-Oracle-Autonomous-SOTA
on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:
jobs:
  run-sota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Generate Factual History
        run: python seed_history.py
      - name: Calibrate & Backtest
        run: python backtest.py
      - name: Run Predictions
        run: python oracle.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit Learned Parameters
        run: |
          git config --global user.name 'Oracle-Bot'
          git config --global user.email 'bot@oracle.ai'
          git add players.json history.csv
          git commit -m "SOTA Update: Factual Calibration Complete" || echo "No changes"
          git push
